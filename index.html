 <!DOCTYPE html>
 <html lang="ru">
 <head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <title>Сосед по интересам — кликабельный прототип</title>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,800&display=swap">
 <style>
 :root{--bg:#E9ECF2;--panel:#fff;--txt:#1E2433;--mut:#667089;--line:#D6DBE6;color-scheme:light}
 @media (prefers-color-scheme:dark){:root{--bg:#10172A;--panel:#18213A;--txt:#E8EDF7;--mut:#9AA8C4;--line:#2B3858;color-scheme:dark}}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 Inter,-apple-system,"SF Pro Text",Arial,sans-serif}
 .wrap{max-width:960px;margin:0 auto;padding:20px 16px;padding-top:max(20px,env(safe-area-inset-top));display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
 .phone{--navy:#2B4A8B;--page:#F7F7F8;--card:#fff;--ink:#222;--gray:#777;--chip:#E9E9EC;--green:#2BA84A;--red:#E5382F;
  width:392px;height:826px;background:var(--page);color:var(--ink);border-radius:58px;border:10px solid #0B0B0D;overflow:hidden;position:relative;flex:none;font-family:Inter,-apple-system,sans-serif;box-shadow:0 0 0 2px #3a3a40,0 20px 50px rgba(0,0,0,.3)}
 .isl{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:12}
 .status{position:absolute;top:0;left:0;right:0;height:56px;padding:0 34px 0 42px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;z-index:11;pointer-events:none}
 .status span:last-child{display:flex;gap:6px;align-items:center}
 .hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:13}
 .head{position:absolute;top:56px;left:0;right:0;height:62px;display:flex;align-items:center;justify-content:center}
 .circ{position:absolute;left:14px;top:10px;width:56px;height:42px;border-radius:21px;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.1);cursor:pointer;color:#111;display:grid;place-items:center}
 .body{position:absolute;top:118px;bottom:0;left:0;right:0;overflow:auto;padding:6px 14px 180px}
 .pill{background:var(--navy);color:#fff;border-radius:22px;text-align:center;font-weight:600;font-size:13px;letter-spacing:.4px;padding:11px;margin:4px 0 10px;text-transform:uppercase}
 .card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px}
 .card h3{margin:0 0 3px;font-size:17px;font-weight:600}
 .card p,p.g{margin:0;color:var(--gray);font-size:14px}
 p.g{margin-bottom:10px}
 .tap{cursor:pointer;display:flex;gap:12px;align-items:center}
 .tap:hover{box-shadow:0 0 0 2px var(--navy) inset}
 .ic{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;flex:none;overflow:hidden}
 .ic img{width:100%;height:100%;object-fit:cover;display:block}
 .ic.big{width:60px;height:60px;font-size:24px}.ic.red{background:var(--red)}.ic.tint{background:#E3E8F3;color:var(--navy)}
 h2{font-size:24px;margin:6px 2px 8px;font-weight:700;line-height:1.2}
 .chips{display:flex;flex-wrap:wrap;gap:8px}
 .chip{border:0;background:var(--chip);color:var(--ink);border-radius:20px;padding:9px 15px;font-weight:500;font-size:15px;font-family:inherit;cursor:pointer}
 .chip.on{background:var(--navy);color:#fff}
 .chip.s{padding:3px 10px;font-size:12px;cursor:default}
 .btn{width:100%;height:48px;border:0;border-radius:12px;margin-top:10px;background:var(--navy);color:#fff;font-weight:600;font-size:16px;font-family:inherit;cursor:pointer}
 .btn.sec{background:#E3E8F3;color:var(--navy)}
 .seg{display:flex;background:var(--chip);border-radius:22px;padding:3px;margin-bottom:12px}
 .seg button{flex:1;border:0;background:none;cursor:pointer;font-family:inherit;padding:8px 4px;border-radius:19px;font-size:14px;color:var(--gray)}
 .seg .on{background:var(--navy);color:#fff}
 .opt{display:block;width:100%;text-align:left;border:2px solid transparent;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;font-weight:600;font-size:17px;font-family:inherit;cursor:pointer;color:var(--ink)}
 .opt.on{border-color:var(--navy)}.opt span{display:block;font-weight:400;font-size:14px;color:var(--gray);margin-top:2px}
 .opt span b{color:var(--navy);font-weight:600}
 .row{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.row h3{margin:0}
 .bar{height:5px;border-radius:3px;background:#E4E4E8;margin-top:7px}.bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
 .msg{max-width:82%;padding:10px 13px;border-radius:18px;margin-bottom:8px;background:#fff;font-size:15px}
 .msg.me{margin-left:auto;background:var(--navy);color:#fff}
 .seats{display:grid;grid-template-columns:26px repeat(3,1fr) 22px repeat(3,1fr);gap:6px;align-items:center;text-align:center;font-weight:600;font-size:13px}
 .seat{border:0;border-radius:10px;padding:11px 0;background:var(--chip);font-weight:500;font-size:13px;font-family:inherit;cursor:pointer;color:var(--ink)}
 .seat.x{background:#D3D3D8;color:#9A9AA2;cursor:not-allowed}.seat.on{background:var(--navy);color:#fff}
 .errbox{text-align:center;padding:30px 10px 0}
 .errbox .ic{margin:0 auto 14px;background:#FDECEA;color:var(--red);width:68px;height:68px}
 .fld{background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:10px;position:relative}
 .fld label{display:block;font-size:12px;color:var(--gray)}
 .fld input{border:0;outline:0;width:100%;font:inherit;font-size:17px;padding:3px 60px 3px 0;background:none;color:var(--ink)}
 .eye,.lnk{border:0;background:none;color:var(--navy);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
 .eye{position:absolute;right:12px;top:22px}.lnk{padding:6px 2px}
 .cta{position:absolute;left:14px;right:14px;bottom:98px;height:52px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;font-size:17px;font-family:inherit;cursor:pointer;z-index:4}
 .cta:disabled{background:#D3D3D8;color:#8E8E96;cursor:not-allowed}
 .tabs{position:absolute;left:10px;right:10px;bottom:22px;height:66px;background:rgba(255,255,255,.97);border-radius:33px;box-shadow:0 2px 16px rgba(0,0,0,.14);display:flex;padding:5px;z-index:5}
 .tab{flex:1;border:0;background:none;border-radius:28px;font-weight:600;font-size:10px;font-family:inherit;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
 .tab.on{background:var(--chip);color:var(--navy)}
 .toast{position:absolute;left:20px;right:20px;bottom:164px;background:#222;color:#fff;padding:11px 15px;border-radius:14px;font-size:14px;z-index:6}
 .lock{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0,#4F78C0,#26407A 55%,#16264F);color:#fff;text-align:center;padding:84px 16px 0;z-index:3}
 .lock .d{font-size:20px;font-weight:600;opacity:.9}.lock .t{font-size:96px;font-weight:600;line-height:1.05;letter-spacing:-2px}
 .push{background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border:0;border-radius:24px;padding:12px 14px;text-align:left;margin-top:190px;width:100%;font:inherit;font-size:14px;cursor:pointer;line-height:1.35}
 .push small{display:flex;gap:7px;align-items:center;opacity:.85;font-size:12px;margin-bottom:3px}
 .push b{font-size:15px}
 .ai{width:20px;height:20px;border-radius:5px;background:#fff;color:#2B4A8B;display:grid;place-items:center}
 .lk{position:absolute;bottom:44px;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center;color:#fff}
 .side{width:300px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
 .side h3{margin:0 0 4px;font-size:16px}.side p{color:var(--mut);font-size:13px;margin:0 0 8px}
 .sec2{font-size:13px;color:var(--mut);margin:14px 0 6px}
 .sb{display:block;width:100%;text-align:left;border:1px solid var(--line);background:none;color:var(--txt);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-weight:500;font-size:13px;font-family:inherit;cursor:pointer}
 .sb:hover{border-color:#2B4A8B}.sb.cur{background:#2B4A8B;color:#fff;border-color:#2B4A8B}
 .sb.e{color:#E5382F}.sb.e.cur{background:#E5382F;color:#fff;border-color:#E5382F}
 button:focus-visible{outline:3px solid #6AA2FF;outline-offset:2px}
 .opt.food{display:flex;gap:12px;align-items:center;padding:10px 14px 10px 10px}.opt.food>div{flex:1}
 .th{width:58px;height:58px;border-radius:14px;background:#EEF1F8;display:grid;place-items:center;font-size:32px;font-style:normal;flex:none}
 .seat.q{background:#DCE3F2;color:var(--navy);display:grid;place-items:center;cursor:not-allowed}
 </style>
 </head>
 <body>
 <div class="wrap">
   <div class="phone" id="phone"></div>
   <aside class="side">
     <h3>Сосед по интересам</h3>
     <p>Кликабельный прототип. Проходите путь как пользователь или переходите по схеме.</p>
     <div class="sec2">Ошибки на этом экране</div><div id="errs"></div>
     <div class="sec2" id="hm"></div><div id="main"></div>
     <div class="sec2" id="he"></div><div id="all-err"></div>
     <button class="sb" id="reset" style="margin-top:10px">Начать сначала</button>
   </aside>
 </div>

 }
 var toastTimer=null,newMateTimer=null;
 function go(id){var toast=TOASTS[S.cur+'>'+id]||'';if(toastTimer)clearTimeout(toastTimer);if(newMateTimer)clearTimeout(newMateTimer);S.toast=toast;if(id=='s11')S.matched=true;if(S.cur=='e5')S.matched=false;S.cur=id;render();
   if(toast){toastTimer=setTimeout(function(){S.toast='';render();if(id=='s2'&&toast=='Сообщим, когда появятся попутчики'){newMateTimer=setTimeout(function(){S.newMates=true;if(S.cur=='s2')render()},3000)}},2000)}
 }
 document.addEventListener('input',function(ev){
   var t=ev.target;if(t.id=='lg')S.login=t.value;else if(t.id=='pw')S.pass=t.value;else return;
   var c=document.querySelector('.cta');if(c)c.disabled=!(S.login.trim()&&S.pass);
 });
 document.addEventListener('click',function(ev){
   var t=ev.target.closest('[data-go],[data-mood],[data-int],[data-seat],[data-filter],[data-aisle],[data-snack],[data-pay],[data-method],[data-eye],[data-offer],[data-change-seats],#reset');if(!t||t.disabled)return;
   if(t.id=='reset'){S=S0();render();return}
   if(t.dataset.eye){S.showp=!S.showp;render();return}
   if(t.dataset.mood){S.mood=t.dataset.mood;S.seats=[];S.toast='';render();return}
   if(t.dataset.int){var i=S.interests.indexOf(t.dataset.int);i>-1?S.interests.splice(i,1):S.interests.push(t.dataset.int);render();return}
   if(t.dataset.seat){var s=t.dataset.seat,j=S.seats.indexOf(s),limit=quietMode()?1:2;if(j>-1)S.seats.splice(j,1);else{if(S.seats.length>=limit)S.seats.shift();S.seats.push(s)}render();return}
   if(t.dataset.changeSeats){S.returnToPay=true;S.seats=[];go('s10');return}
   if(t.dataset.offer=='confirm'){S.seats=S.suggestedSeats.slice();S.paySeat=S.seats[0];S.returnToPay=false;go('s13');return}
   if(t.dataset.offer=='change'){S.seats=[];S.returnToPay=false;go('s10');return}
   if(t.dataset.aisle){S.aisle=+t.dataset.aisle;S.seats=[S.aisle+'C',S.aisle+'D'];render();return}
   if(t.dataset.snack){var k=+t.dataset.snack,d=+(t.dataset.delta||1);S.snack[k]=Math.max(0,snackQty(k)+d);render();return}
   if(t.dataset.pay){S.paySeat=t.dataset.pay;render();return}
   if(t.dataset.method){S.method=t.dataset.method;render();return}
   if(t.dataset.filter){S.filter=t.dataset.filter;render();return}
   if(t.dataset.person!==undefined)S.person=+t.dataset.person;
   if(t.dataset.act=='order'){Object.keys(S.snack).forEach(function(k){if(S.snack[k]>0){if(S.ordered.indexOf(+k)<0)S.ordered.push(+k);S.orderedQty[k]=(S.orderedQty[k]||0)+S.snack[k]}});S.snack={};}
   if(t.dataset.act=='pay'){S.paid=paySeat();S.returnToPay=false;}
   go(t.dataset.go);
 });
 render();
 </script>
 </body>
 </html>
